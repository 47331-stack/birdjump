<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bird Jump</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0d1117;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Responsive container filling almost the full screen */
        .game-wrapper {
            position: relative;
            width: 98vw;
            height: 94vh;
            max-width: 1400px;
            max-height: 850px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(112, 197, 206, 0.3);
            border: 3px solid rgba(255, 255, 255, 0.15);
            background: #70c5ce;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            cursor: pointer;
        }

        /* Fixed Overlay Container centered over the screen */
        .overlay-menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(13, 17, 23, 0.55);
            backdrop-filter: blur(4px);
            z-index: 100;
            pointer-events: auto;
            transition: opacity 0.25s ease;
        }

        .overlay-menu.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .menu-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px 45px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            border: 3px solid #fbc531;
        }

        .menu-title {
            font-size: 32px;
            font-weight: 900;
            color: #2d3436;
            margin-bottom: 5px;
        }

        .menu-subtitle {
            font-size: 16px;
            color: #636e72;
            font-weight: 600;
        }

        /* Fixed button style that stays firmly in place */
        .btn-start {
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            color: #ffffff;
            border: 3px solid #ffffff;
            padding: 16px 45px;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 1px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 71, 87, 0.4);
            transition: transform 0.15s ease, background 0.15s ease;
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
            outline: none;
            margin-top: 10px;
        }

        .btn-start:hover {
            transform: scale(1.05);
            background: linear-gradient(135deg, #ff6b81, #ff4757);
        }

        .btn-start:active {
            transform: scale(0.96);
        }

        .controls-hint {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            font-weight: 700;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
            pointer-events: none;
            letter-spacing: 0.5px;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="game-wrapper" id="gameWrapper">
        <canvas id="gameCanvas"></canvas>

        <!-- Fixed Overlay Menu (guarantees the button stays stationary) -->
        <div class="overlay-menu" id="overlayMenu">
            <div class="menu-card" id="menuCard">
                <div class="menu-subtitle" id="menuSubtitle">Pressione o botão para começar</div>
                <button id="startButton" class="btn-start">Começar Jogo</button>
            </div>
        </div>

        <div class="controls-hint">Pule com ESPAÇO ou CLICANDO na tela</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('startButton');
        const overlayMenu = document.getElementById('overlayMenu');
        const menuSubtitle = document.getElementById('menuSubtitle');
        const wrapper = document.getElementById('gameWrapper');

        let cw = 0;
        let ch = 0;

        function resizeCanvas() {
            cw = wrapper.clientWidth;
            ch = wrapper.clientHeight;
            canvas.width = cw;
            canvas.height = ch;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // State Machine Variables
        let gameLoopId = null;
        let gameState = 'START'; // 'START', 'PLAYING', 'GAMEOVER', 'VICTORY'
        let score = 0;
        let level = 1;
        const maxLevels = 20;

        // Speed Progression
        let baseSpeed = 4.2; 
        let currentSpeed = baseSpeed;
        let bgOffset1 = 0;
        let bgOffset2 = 0;

        // Particles System
        let particles = [];

        function createParticles(x, y, color, count = 8) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6 - 2,
                    size: Math.random() * 6 + 3,
                    color: color,
                    alpha: 1,
                    decay: Math.random() * 0.03 + 0.015,
                    rotation: Math.random() * Math.PI * 2
                });
            }
        }

        function updateAndDrawParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= p.decay;
                p.rotation += 0.1;

                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                    continue;
                }

                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rotation);
                ctx.beginPath();
                ctx.arc(0, 0, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        const bird = {
            x: 120,
            y: 300,
            radius: 20,
            width: 46,
            height: 36,
            gravity: 0.42,
            lift: -8.8,
            velocity: 0,
            rotation: 0,
            wingAngle: 0,
            wingSpeed: 0.15,

            reset() {
                this.x = cw * 0.22;
                this.y = ch * 0.45;
                this.velocity = 0;
                this.rotation = 0;
            },

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);

                // Smooth rotation based on vertical speed
                this.rotation = Math.min(Math.PI / 3, Math.max(-Math.PI / 4, this.velocity * 0.06));
                ctx.rotate(this.rotation);

                // Drop Shadow
                ctx.fillStyle = 'rgba(0,0,0,0.15)';
                ctx.beginPath();
                ctx.ellipse(2, 18, 18, 6, 0, 0, Math.PI * 2);
                ctx.fill();

                // Vibrant Yellow Body
                let gradBody = ctx.createRadialGradient(-4, -4, 2, 0, 0, 22);
                gradBody.addColorStop(0, '#fff366');
                gradBody.addColorStop(0.7, '#fbc531');
                gradBody.addColorStop(1, '#e1b12c');

                ctx.fillStyle = gradBody;
                ctx.beginPath();
                ctx.ellipse(0, 0, 22, 17, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.lineWidth = 2.5;
                ctx.strokeStyle = '#2d3436';
                ctx.stroke();

                // Animated Wing
                this.wingAngle += this.wingSpeed;
                let wingY = Math.sin(this.wingAngle) * 6;

                ctx.fillStyle = '#e1b12c';
                ctx.beginPath();
                ctx.ellipse(-8, 2 + wingY, 11, 7, -0.3, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // Cartoon Eye
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(10, -5, 9, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // Pupil + Glint
                ctx.fillStyle = '#2d3436';
                ctx.beginPath();
                ctx.arc(13, -5, 3.5, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(14.5, -6.5, 1.2, 0, Math.PI * 2);
                ctx.fill();

                // Large Red Beak
                let gradBeak = ctx.createLinearGradient(12, 0, 26, 8);
                gradBeak.addColorStop(0, '#ff4757');
                gradBeak.addColorStop(1, '#ff6b81');

                ctx.fillStyle = gradBeak;
                ctx.beginPath();
                ctx.ellipse(15, 6, 13, 7, 0.05, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // Beak Split Line
                ctx.beginPath();
                ctx.moveTo(12, 6);
                ctx.lineTo(27, 6);
                ctx.strokeStyle = '#2d3436';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                ctx.restore();
            },

            update() {
                this.velocity += this.gravity;
                this.y += this.velocity;

                const groundHeight = 65;
                if (this.y + this.height / 2 >= ch - groundHeight) {
                    this.y = ch - groundHeight - this.height / 2;
                    gameOver();
                }

                if (this.y - this.height / 2 <= 0) {
                    this.y = this.height / 2;
                    this.velocity = 0;
                }
            },

            jump() {
                this.velocity = this.lift;
                this.wingSpeed = 0.4;
                setTimeout(() => { this.wingSpeed = 0.15; }, 200);

                createParticles(this.x - 10, this.y + 10, '#fff366', 5);
            }
        };

        let pipes = [];
        const pipeWidth = 75;
        let pipeGap = 165;
        let spawnTimer = 0;

        function createPipe() {
            const groundHeight = 65;
            const minTop = 60;
            const maxTop = ch - groundHeight - pipeGap - minTop;
            const topHeight = Math.floor(Math.random() * (maxTop - minTop + 1)) + minTop;

            pipes.push({
                x: cw,
                top: topHeight,
                bottom: ch - groundHeight - (topHeight + pipeGap),
                passed: false
            });
        }

        function drawPipeSegment(x, y, width, height, isTop) {
            let grad = ctx.createLinearGradient(x, y, x + width, y);
            grad.addColorStop(0, '#2ed573');
            grad.addColorStop(0.25, '#7bed9f');
            grad.addColorStop(0.6, '#2ed573');
            grad.addColorStop(1, '#26af5f');

            ctx.fillStyle = grad;
            ctx.fillRect(x, y, width, height);
            ctx.strokeStyle = '#1e824c';
            ctx.lineWidth = 2.5;
            ctx.strokeRect(x, y, width, height);

            const capHeight = 26;
            const capExtraWidth = 10;
            const capX = x - capExtraWidth / 2;
            const capY = isTop ? y + height - capHeight : y;

            let gradCap = ctx.createLinearGradient(capX, capY, capX + width + capExtraWidth, capY);
            gradCap.addColorStop(0, '#2ed573');
            gradCap.addColorStop(0.3, '#a8ffc5');
            gradCap.addColorStop(0.7, '#2ed573');
            gradCap.addColorStop(1, '#1e824c');

            ctx.fillStyle = gradCap;
            ctx.fillRect(capX, capY, width + capExtraWidth, capHeight);
            ctx.strokeRect(capX, capY, width + capExtraWidth, capHeight);
        }

        function drawPipes() {
            pipes.forEach(pipe => {
                drawPipeSegment(pipe.x, 0, pipeWidth, pipe.top, true);
                const bottomY = ch - 65 - pipe.bottom;
                drawPipeSegment(pipe.x, bottomY, pipeWidth, pipe.bottom, false);
            });
        }

        function updatePipes() {
            spawnTimer++;
            const spawnInterval = Math.max(65, Math.floor(110 - (level * 2)));

            if (spawnTimer > spawnInterval) {
                createPipe();
                spawnTimer = 0;
            }

            for (let i = pipes.length - 1; i >= 0; i--) {
                let pipe = pipes[i];
                pipe.x -= currentSpeed;

                const birdLeft = bird.x - bird.radius + 4;
                const birdRight = bird.x + bird.radius - 4;
                const birdTop = bird.y - bird.radius + 4;
                const birdBottom = bird.y + bird.radius - 4;

                const pipeRight = pipe.x + pipeWidth;
                const bottomY = ch - 65 - pipe.bottom;

                if (birdRight > pipe.x && birdLeft < pipeRight) {
                    if (birdTop < pipe.top || birdBottom > bottomY) {
                        createParticles(bird.x, bird.y, '#ff4757', 20);
                        gameOver();
                    }
                }

                if (pipe.x + pipeWidth < bird.x && !pipe.passed) {
                    pipe.passed = true;
                    score++;

                    createParticles(bird.x + 20, bird.y, '#2ed573', 12);

                    if (score <= maxLevels) {
                        level = score;
                        currentSpeed = baseSpeed + (level * 0.45);
                    }

                    if (score >= maxLevels) {
                        victory();
                    }
                }

                if (pipe.x + pipeWidth + 20 < 0) {
                    pipes.splice(i, 1);
                }
            }
        }

        function drawParallaxBackground() {
            let skyGrad = ctx.createLinearGradient(0, 0, 0, ch);
            skyGrad.addColorStop(0, '#54a0ff');
            skyGrad.addColorStop(0.65, '#70c5ce');
            skyGrad.addColorStop(1, '#a1eafb');

            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, cw, ch);

            // Sunbeams
            ctx.save();
            ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
            const rays = 12;
            const centerX = cw * 0.5;
            for (let i = 0; i < rays; i++) {
                ctx.beginPath();
                ctx.moveTo(centerX, -50);
                ctx.arc(centerX, -50, cw * 1.2, (i * Math.PI) / (rays / 2), ((i + 0.5) * Math.PI) / (rays / 2));
                ctx.fill();
            }
            ctx.restore();

            // Clouds
            if (gameState === 'PLAYING') bgOffset1 += currentSpeed * 0.15;
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            for (let i = -1; i < 4; i++) {
                let x = (i * 400) - (bgOffset1 % 400);
                ctx.beginPath();
                ctx.arc(x + 100, ch - 220, 70, 0, Math.PI * 2);
                ctx.arc(x + 180, ch - 250, 95, 0, Math.PI * 2);
                ctx.arc(x + 260, ch - 220, 70, 0, Math.PI * 2);
                ctx.fill();
            }

            // World Monuments Layer
            if (gameState === 'PLAYING') bgOffset2 += currentSpeed * 0.35;
            ctx.fillStyle = '#65b2c6';

            for (let i = -1; i < 3; i++) {
                let x = (i * 700) - (bgOffset2 % 700);

                // Eiffel Tower
                ctx.beginPath();
                ctx.moveTo(x + 100, ch - 65);
                ctx.lineTo(x + 130, ch - 260);
                ctx.lineTo(x + 136, ch - 260);
                ctx.lineTo(x + 166, ch - 65);
                ctx.fill();

                // Highrise
                ctx.fillRect(x + 230, ch - 240, 45, 175);
                ctx.beginPath();
                ctx.moveTo(x + 225, ch - 240);
                ctx.lineTo(x + 252, ch - 290);
                ctx.lineTo(x + 280, ch - 240);
                ctx.fill();

                // Monument
                ctx.fillRect(x + 390, ch - 180, 22, 115);
                ctx.fillRect(x + 365, ch - 165, 72, 14);
                ctx.beginPath();
                ctx.arc(x + 401, ch - 190, 10, 0, Math.PI * 2);
                ctx.fill();

                // Pyramids
                ctx.beginPath();
                ctx.moveTo(x + 490, ch - 65);
                ctx.lineTo(x + 550, ch - 170);
                ctx.lineTo(x + 610, ch - 65);
                ctx.fill();
            }

            // Ground
            const groundY = ch - 65;
            let groundGrad = ctx.createLinearGradient(0, groundY, 0, ch);
            groundGrad.addColorStop(0, '#55a018');
            groundGrad.addColorStop(0.15, '#73bf2e');
            groundGrad.addColorStop(1, '#468013');

            ctx.fillStyle = groundGrad;
            ctx.fillRect(0, groundY, cw, 65);

            ctx.fillStyle = '#9ee64f';
            ctx.fillRect(0, groundY, cw, 6);

            ctx.strokeStyle = '#2d3436';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, groundY);
            ctx.lineTo(cw, groundY);
            ctx.stroke();
        }

        function drawHUD() {
            ctx.save();
            ctx.shadowColor = 'rgba(0, 0, 0, 0.4)';
            ctx.shadowBlur = 6;
            ctx.shadowOffsetX = 2;
            ctx.shadowOffsetY = 2;

            ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
            ctx.beginPath();
            ctx.roundRect(20, 20, 220, 80, 15);
            ctx.fill();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.font = '900 20px "Segoe UI", Arial, sans-serif';
            ctx.fillText(`NÍVEL: ${level} / ${maxLevels}`, 35, 52);

            ctx.fillStyle = '#fbc531';
            ctx.font = '900 22px "Segoe UI", Arial, sans-serif';
            ctx.fillText(`PONTOS: ${score}`, 35, 82);

            ctx.restore();
        }

        function gameLoop() {
            ctx.clearRect(0, 0, cw, ch);

            drawParallaxBackground();

            if (gameState === 'PLAYING') {
                bird.update();
                bird.draw();
                updatePipes();
                drawPipes();
                updateAndDrawParticles();
                drawHUD();
            } else if (gameState === 'GAMEOVER' || gameState === 'VICTORY') {
                drawPipes();
                bird.draw();
                updateAndDrawParticles();
                drawHUD();
            } else {
                bird.y = ch * 0.45 + Math.sin(Date.now() * 0.004) * 12;
                bird.draw();
                updateAndDrawParticles();
            }

            gameLoopId = requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            menuSubtitle.innerText = 'FIM DE JOGO!';
            menuSubtitle.style.color = '#ff4757';
            startBtn.innerText = 'Tentar Novamente';
            overlayMenu.classList.remove('hidden');
        }

        function victory() {
            gameState = 'VICTORY';
            menuSubtitle.innerText = `VOCÊ VENCEU! Completou os ${maxLevels} níveis!`;
            menuSubtitle.style.color = '#2ed573';
            startBtn.innerText = 'Jogar Novamente';
            overlayMenu.classList.remove('hidden');
        }

        function resetGame() {
            bird.reset();
            pipes = [];
            particles = [];
            score = 0;
            level = 1;
            currentSpeed = baseSpeed;
            spawnTimer = 0;
            gameState = 'PLAYING';
            overlayMenu.classList.add('hidden');
        }

        function handleJump() {
            if (gameState === 'PLAYING') {
                bird.jump();
            }
        }

        startBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            resetGame();
        });

        // Spacebar Jump
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                handleJump();
            }
        });

        // Mouse Click or Touch Jump anywhere on the Canvas
        canvas.addEventListener('mousedown', (e) => {
            e.preventDefault();
            handleJump();
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            handleJump();
        }, { passive: false });

        // Start animation loop
        gameLoop();
    </script>
</body>
</html>
